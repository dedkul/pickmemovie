<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PickMeMovie</title>
  <script>
    // Theme before first paint: saved choice, else the OS setting.
    try {
      const t = localStorage.getItem('pmm-theme');
      document.documentElement.dataset.theme = t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    } catch (e) { document.documentElement.dataset.theme = 'light'; }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }
    button, select, input { font: inherit; color: inherit; }
    button { background: none; border: none; cursor: pointer; }
    svg { display: block; flex-shrink: 0; }

    /* ── Tokens ───────────────────────────────────────────────
       Light = pastel lavender ground (default). Dark = cool slate.
       One accent, used only for "act now" and the primary button.
       Text tiers all ≥ 4.5:1 on --bg. */
    :root {
      --bg:          #F4F1F8;
      --bg-2:        #EAE5F2;
      --surface:     #FCFBFE;
      --line:        rgba(34, 30, 51, .09);
      --line-2:      rgba(34, 30, 51, .18);
      --text:        #221E33;
      --text-2:      #4E4864;
      --text-3:      #6A6482;
      --accent:      #5048C8;
      --accent-ink:  #FFFFFF;
      --accent-soft: #E3E0FA;
      --on-soft:     #3B34A8;
      --shadow:      0 1px 2px rgba(34,30,51,.05), 0 6px 20px rgba(34,30,51,.05);
      --r: 12px;
      --wrap: 1280px;
      color-scheme: light;
    }
    [data-theme="dark"] {
      --bg:          #131519;
      --bg-2:        #1F2228;
      --surface:     #1A1D22;
      --line:        rgba(255, 255, 255, .07);
      --line-2:      rgba(255, 255, 255, .15);
      --text:        #ECEDF0;
      --text-2:      #B3B7C1;
      --text-3:      #8E939E;
      --accent:      #ABA6FF;
      --accent-ink:  #131519;
      --accent-soft: rgba(171, 166, 255, .14);
      --on-soft:     #CBC8FF;
      --shadow:      none;
      color-scheme: dark;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', system-ui, sans-serif;
      font-size: 15px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      transition: background .2s, color .2s;
    }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
    .tnum { font-variant-numeric: tabular-nums; }
    .wrap { max-width: var(--wrap); margin: 0 auto; padding: 0 20px; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    /* ── Header ───────────────────────────────────────────────── */
    .top {
      position: sticky; top: 0; z-index: 40;
      background: var(--bg);
      border-bottom: 1px solid var(--line);
    }
    .top-row { display: flex; align-items: center; justify-content: space-between; height: 60px; }
    .wordmark { font-size: 19px; font-weight: 600; letter-spacing: -.02em; color: var(--text); text-decoration: none; }
    .top-actions { display: flex; align-items: center; gap: 6px; }
    .btn-quiet {
      padding: 8px 14px; border-radius: 100px;
      font-size: 14px; font-weight: 500; color: var(--text-2);
      transition: background .15s, color .15s;
    }
    .btn-quiet:hover:not(:disabled) { background: var(--bg-2); color: var(--text); }
    .btn-quiet:disabled { opacity: .45; cursor: not-allowed; }
    .icon-btn {
      width: 38px; height: 38px; border-radius: 50%;
      display: grid; place-items: center; color: var(--text-2);
      transition: background .15s, color .15s;
    }
    .icon-btn:hover { background: var(--bg-2); color: var(--text); }
    [data-theme="dark"] .i-moon, :root:not([data-theme="dark"]) .i-sun { display: none; }

    /* Mobile summary */
    .summary-bar {
      display: flex; align-items: center; gap: 10px;
      width: 100%; padding: 0 20px 14px; text-align: left;
    }
    .summary-pill {
      flex: 1; min-width: 0;
      display: flex; align-items: center; gap: 8px;
      padding: 11px 14px;
      background: var(--surface); border: 1px solid var(--line); border-radius: 100px;
      box-shadow: var(--shadow);
      font-size: 14px; color: var(--text-2);
    }
    .summary-pill span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .summary-pill strong { color: var(--text); font-weight: 600; }

    /* ── Controls ─────────────────────────────────────────────
       Mobile: full-screen sheet. Desktop: one slim row under the header. */
    .controls {
      position: fixed; inset: 0; z-index: 60;
      background: var(--bg);
      overflow-y: auto;
      display: flex; flex-direction: column;
    }
    body:not(.filters-open) .controls { display: none; }
    .panel-hd {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 12px 4px 20px; font-size: 17px; font-weight: 600;
    }
    .ctl { padding: 16px 20px; }
    .ctl-label { display: block; font-size: 13px; font-weight: 500; color: var(--text-3); margin-bottom: 10px; }
    .panel-ft {
      margin-top: auto; position: sticky; bottom: 0;
      padding: 16px 20px 20px; background: var(--bg);
    }

    .field {
      position: relative; display: flex; align-items: center;
      background: var(--surface); border: 1px solid var(--line-2); border-radius: 10px;
      transition: border-color .15s;
    }
    .field:focus-within { border-color: var(--accent); }
    .field > .lead { position: absolute; left: 12px; color: var(--text-3); pointer-events: none; }
    .loc-input {
      flex: 1; min-width: 0;
      background: none; border: none; outline: none;
      padding: 10px 40px 10px 36px;
      font-size: 15px; font-weight: 500;
    }
    .loc-input::placeholder { color: var(--text-3); font-weight: 400; }
    .locate { position: absolute; right: 4px; width: 34px; height: 34px; }
    .loc-note { margin-top: 8px; font-size: 13px; color: var(--text-2); }

    .ac-dropdown {
      position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 70;
      background: var(--surface); border: 1px solid var(--line-2); border-radius: 10px;
      box-shadow: 0 12px 32px rgba(0,0,0,.14); overflow: hidden;
    }
    .ac-item { display: block; width: 100%; text-align: left; padding: 10px 14px; cursor: pointer; }
    .ac-item[aria-selected="true"] { background: var(--bg-2); }
    .ac-name { display: block; font-size: 14px; font-weight: 500; }
    .ac-sub  { display: block; font-size: 13px; color: var(--text-3); }
    .ac-empty { padding: 12px 14px; font-size: 14px; color: var(--text-2); }

    /* Pills — one selected style everywhere */
    .pills { display: flex; flex-wrap: wrap; gap: 8px; }
    .pill {
      padding: 8px 14px; border-radius: 100px;
      border: 1px solid var(--line-2); background: var(--surface);
      font-size: 14px; font-weight: 500; color: var(--text-2);
      transition: background .12s, color .12s, border-color .12s;
    }
    .pill:hover { color: var(--text); border-color: var(--text-3); }
    .pill[aria-pressed="true"] { background: var(--text); border-color: var(--text); color: var(--bg); }
    .pill .sub { font-weight: 400; opacity: .7; margin-left: 4px; }

    .days-btn { display: none; }
    .select-wrap { position: relative; display: inline-flex; align-items: center; }
    .select-wrap select {
      appearance: none; -webkit-appearance: none;
      padding: 9px 36px 9px 14px; border-radius: 100px;
      border: 1px solid var(--line-2); background: var(--surface);
      font-size: 14px; font-weight: 500; cursor: pointer;
    }
    .select-wrap svg { position: absolute; right: 12px; pointer-events: none; color: var(--text-3); }

    .btn-primary {
      display: block; width: 100%; padding: 13px; border-radius: 100px;
      background: var(--accent); color: var(--accent-ink);
      font-size: 15px; font-weight: 600; text-align: center; text-decoration: none;
      transition: filter .15s;
    }
    .btn-primary:hover { filter: brightness(1.08); }

    /* ── Results ──────────────────────────────────────────────── */
    .results-hd { padding: 28px 0 20px; }
    .results-title { font-size: 26px; font-weight: 600; letter-spacing: -.02em; line-height: 1.15; }
    .results-sub { margin-top: 6px; font-size: 15px; color: var(--text-2); }

    .film-grid { display: grid; grid-template-columns: 1fr; gap: 16px; padding-bottom: 32px; align-items: start; }

    /* Phone: small poster beside the title, sessions full-width below.
       Desktop: poster runs down the left, sessions sit beside it. */
    .film {
      display: grid; grid-template-columns: 64px 1fr; gap: 0 14px;
      grid-template-areas: "poster head" "list list";
      padding: 16px;
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
      box-shadow: var(--shadow);
    }
    .poster { width: 100%; aspect-ratio: 2 / 3; border-radius: 8px; }
    .film > .poster { grid-area: poster; }
    .film-head { grid-area: head; min-width: 0; align-self: center; }
    .film-list { grid-area: list; min-width: 0; }
    .film-title { font-size: 17px; font-weight: 600; letter-spacing: -.01em; line-height: 1.25; }
    .film-meta { margin-top: 2px; font-size: 14px; color: var(--text-3); }

    .sessions { margin-top: 12px; border-top: 1px solid var(--line); }
    .s-row {
      display: grid;
      grid-template-columns: 74px 1fr;
      grid-template-areas: "time where" "time cue" "time note";
      gap: 2px 12px; align-items: start;
      padding: 10px 6px; margin: 0 -6px;
      border-bottom: 1px solid var(--line);
      border-radius: 8px;
      color: inherit; text-decoration: none;
      transition: background .12s;
    }
    .s-row:hover { background: var(--bg-2); }
    .s-time  { grid-area: time; font-size: 15px; font-weight: 600; }
    .s-time .d { display: block; font-size: 12px; font-weight: 500; color: var(--text-3); }
    .s-where { grid-area: where; min-width: 0; font-size: 14px; }
    .s-where .name { font-weight: 500; }
    .s-where .fmt { margin-left: 6px; font-size: 12px; font-weight: 600; color: var(--text-3); }
    .s-where .trip { display: block; font-size: 13px; color: var(--text-3); }
    .s-cue { grid-area: cue; justify-self: start; margin-top: 4px; font-size: 13px; font-weight: 500; color: var(--text-2); }
    .s-cue.tight    { background: var(--accent); color: var(--accent-ink); padding: 2px 10px; border-radius: 100px; font-weight: 600; }
    .s-cue.trailers { background: var(--accent); color: var(--accent-ink); padding: 2px 10px; border-radius: 100px; font-weight: 600; }
    .s-note { grid-area: note; margin-top: 4px; font-size: 13px; color: var(--text-3); }

    .more { margin-top: 8px; font-size: 14px; font-weight: 500; color: var(--text-2); padding: 4px 0; }
    .more:hover { color: var(--text); }

    .empty { padding-bottom: 40px; }
    .empty p { color: var(--text-2); margin-bottom: 14px; }
    .foot { padding: 8px 0 40px; font-size: 13px; color: var(--text-3); }

    /* ── Surprise me ──────────────────────────────────────────── */
    .overlay {
      position: fixed; inset: 0; z-index: 100;
      background: rgba(16, 14, 24, .5);
      display: flex; align-items: flex-end; justify-content: center;
    }
    .modal {
      position: relative; width: 100%; max-width: 420px;
      background: var(--surface); border-radius: 20px 20px 0 0;
      padding: 20px; display: grid; grid-template-columns: 96px 1fr; gap: 16px;
    }
    .modal .poster { width: 96px; }
    .modal-close { position: absolute; top: 10px; right: 10px; }
    .m-eyebrow { font-size: 13px; color: var(--text-3); margin-bottom: 2px; padding-right: 32px; }
    .m-title { font-size: 21px; font-weight: 600; letter-spacing: -.01em; line-height: 1.2; }
    .m-line { margin-top: 4px; font-size: 14px; color: var(--text-2); }
    .m-when { margin-top: 10px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .m-clock { font-size: 17px; font-weight: 600; }
    .m-actions { grid-column: 1 / -1; display: flex; gap: 8px; }
    .m-actions .btn-quiet { border: 1px solid var(--line-2); flex: 1; }
    .m-actions .btn-primary { flex: 1.4; }

    /* ── ≥ 720: two film columns ─────────────────────────────── */
    @media (min-width: 720px) {
      .film-grid { grid-template-columns: repeat(2, 1fr); }
    }

    /* ── ≥ 1024: desktop filter bar ──────────────────────────── */
    @media (min-width: 1024px) {
      .wrap { padding: 0 32px; }
      .summary-bar, .panel-hd, .panel-ft { display: none; }
      .controls, body:not(.filters-open) .controls {
        position: static; display: flex; flex-direction: row; align-items: center; flex-wrap: wrap;
        gap: 10px; padding: 0 0 14px; overflow: visible; background: none; z-index: auto;
      }
      .ctl { padding: 0; }
      .ctl-label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
      .ctl.loc { width: 260px; }
      .loc-input { padding-top: 8px; padding-bottom: 8px; font-size: 14px; }
      .loc-note { position: absolute; margin-top: 4px; }

      /* Days collapse into a popover */
      .ctl.days { position: relative; }
      .days-btn {
        display: inline-flex; align-items: center; gap: 6px;
        padding: 8px 12px 8px 14px; border-radius: 100px;
        border: 1px solid var(--line-2); background: var(--surface);
        font-size: 14px; font-weight: 500;
      }
      .days-btn svg { color: var(--text-3); }
      .days-pop {
        position: absolute; top: calc(100% + 8px); left: 0; z-index: 70;
        width: 300px; padding: 14px;
        background: var(--surface); border: 1px solid var(--line-2); border-radius: 14px;
        box-shadow: 0 12px 32px rgba(0,0,0,.14);
      }
      .days-pop:not(.open) { display: none; }
      .divider { width: 1px; height: 24px; background: var(--line-2); margin: 0 4px; }

      .results-hd { padding: 36px 0 24px; }
      .results-title { font-size: 30px; }
      .film-grid { gap: 20px; }
      .film { grid-template-columns: 112px 1fr; gap: 0 20px; padding: 20px; grid-template-areas: "poster head" "poster list"; grid-template-rows: auto 1fr; }
      .film-head { align-self: start; }

      .overlay { align-items: center; padding: 24px; }
      .modal { border-radius: 20px; }
    }
    @media (max-width: 1023px) { .divider { display: none; } }

    /* ── ≥ 1440: three film columns ──────────────────────────── */
    @media (min-width: 1440px) {
      :root { --wrap: 1480px; }
      .film-grid { grid-template-columns: repeat(3, 1fr); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>

<body>

  <header class="top">
    <div class="wrap top-row">
      <a class="wordmark" href="#">PickMeMovie</a>
      <div class="top-actions">
        <button class="btn-quiet" id="surprise-btn" type="button">Surprise me</button>
        <button class="icon-btn" id="theme-btn" type="button" aria-label="Switch theme">
          <svg class="i-moon" width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 9.6A5.6 5.6 0 0 1 6.4 2.5a5.6 5.6 0 1 0 7.1 7.1Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
          <svg class="i-sun" width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1v1.6M8 13.4V15M1 8h1.6M13.4 8H15M3 3l1.1 1.1M11.9 11.9 13 13M3 13l1.1-1.1M11.9 4.1 13 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>

    <!-- Mobile: one-line summary that opens the filter sheet -->
    <button class="summary-bar" id="summary-bar" type="button" aria-expanded="false" aria-controls="controls">
      <span class="summary-pill">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 14.5s4.8-4.4 4.8-8.1a4.8 4.8 0 0 0-9.6 0c0 3.7 4.8 8.1 4.8 8.1Z" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="8" cy="6.4" r="1.7" fill="currentColor"/></svg>
        <span id="summary-text"></span>
      </span>
    </button>

    <div class="wrap">
      <div class="controls" id="controls" role="group" aria-label="Filters">
        <div class="panel-hd">
          Filters
          <button class="icon-btn" id="panel-close" type="button" aria-label="Close filters">
            <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="m4 4 8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          </button>
        </div>

        <div class="ctl loc">
          <label class="ctl-label" for="loc-input">Leaving from</label>
          <div class="field">
            <svg class="lead" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 14.5s4.8-4.4 4.8-8.1a4.8 4.8 0 0 0-9.6 0c0 3.7 4.8 8.1 4.8 8.1Z" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="8" cy="6.4" r="1.7" fill="currentColor"/></svg>
            <input id="loc-input" class="loc-input" type="text" autocomplete="off" spellcheck="false"
                   placeholder="Suburb or address"
                   role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="ac-list">
            <button class="icon-btn locate" id="geo-btn" type="button" aria-label="Use my current location" title="Use my current location">
              <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="4.3" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="8" cy="8" r="1.4" fill="currentColor"/><path d="M8 1v2.2M8 12.8V15M1 8h2.2M12.8 8H15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            </button>
            <div class="ac-dropdown" id="ac-list" role="listbox" hidden></div>
          </div>
          <p class="loc-note" id="loc-note" role="status" hidden></p>
        </div>

        <div class="ctl time">
          <span class="ctl-label" id="time-label">When</span>
          <div class="pills" id="time-pills" role="group" aria-labelledby="time-label"></div>
        </div>

        <div class="ctl days" id="days-ctl">
          <span class="ctl-label" id="days-label">Which days</span>
          <button class="days-btn" id="days-btn" type="button" aria-expanded="false" aria-controls="days-pop">
            <span id="days-btn-text">Today</span>
            <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="days-pop" id="days-pop">
            <div class="pills" id="day-pills" role="group" aria-labelledby="days-label"></div>
          </div>
        </div>

        <span class="divider" aria-hidden="true"></span>

        <div class="ctl radius">
          <label class="ctl-label" for="radius">How far</label>
          <span class="select-wrap">
            <select id="radius">
              <option value="5">Within 5 km</option>
              <option value="15">Within 15 km</option>
              <option value="30">Within 30 km</option>
              <option value="50">Within 50 km</option>
            </select>
            <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
        </div>

        <div class="panel-ft">
          <button class="btn-primary" id="show-btn" type="button"></button>
        </div>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div class="results-hd" aria-live="polite">
      <h1 class="results-title" id="results-title"></h1>
      <p class="results-sub" id="results-sub"></p>
    </div>
    <div id="list"></div>
    <p class="foot">Prototype · sample showtimes · driving times estimated from distance. You can still make a session if you arrive within 10 minutes of the start — that's the trailers.</p>
  </main>

  <!-- Surprise me -->
  <div class="overlay" id="overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-title">
      <button class="icon-btn modal-close" id="m-close" type="button" aria-label="Close">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="m4 4 8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
      <div class="poster" id="m-poster" aria-hidden="true"></div>
      <div>
        <p class="m-eyebrow" id="m-eyebrow"></p>
        <h2 class="m-title" id="m-title"></h2>
        <p class="m-line" id="m-meta"></p>
        <p class="m-line" id="m-where"></p>
        <div class="m-when"><span class="m-clock tnum" id="m-clock"></span><span id="m-cue"></span></div>
      </div>
      <div class="m-actions">
        <button class="btn-quiet" id="m-another" type="button">Try another</button>
        <a class="btn-primary" id="m-book" href="#" target="_blank" rel="noopener"></a>
      </div>
    </div>
  </div>

  <script>
  /* ══ Clock ═══════════════════════════════════════════════════
     ?now=18:40 pins the demo clock (it still ticks from there). */
  const clockOffset = (() => {
    const p = new URLSearchParams(location.search).get('now');
    if (!p || !/^\d{1,2}:\d{2}$/.test(p)) return 0;
    const [h, m] = p.split(':').map(Number);
    const d = new Date(); d.setHours(h, m, 0, 0);
    return d - Date.now();
  })();
  const now = () => new Date(Date.now() + clockOffset);

  /* ══ Reference data ══════════════════════════════════════════ */
  const BUFFER_MIN  = 10;    // PRD §5.4: trailer grace
  const TIGHT_MIN   = 20;    // under this much slack, flag it
  const NOW_WINDOW  = 180;   // "Leave now" looks this many minutes ahead
  const COVERAGE_KM = 60;    // from the CBD
  const CBD = { lat: -37.8136, lng: 144.9631 };

  const PERIODS = [
    { id: 'morning',   name: 'Morning',   range: 'before 12 pm', from: 0,    to: 720  },
    { id: 'afternoon', name: 'Afternoon', range: '12–5 pm',      from: 720,  to: 1020 },
    { id: 'evening',   name: 'Evening',   range: '5–9 pm',       from: 1020, to: 1260 },
    { id: 'night',     name: 'Night',     range: 'after 9 pm',   from: 1260, to: 1440 },
  ];
  const RADII = [5, 15, 30, 50];

  const SUBURBS = [
    ['Fitzroy', 'VIC 3065', -37.7984, 144.9785], ['Fitzroy North', 'VIC 3068', -37.7833, 144.9850],
    ['Carlton', 'VIC 3053', -37.8001, 144.9671], ['Collingwood', 'VIC 3066', -37.8020, 144.9880],
    ['Brunswick', 'VIC 3056', -37.7667, 144.9600], ['Northcote', 'VIC 3070', -37.7700, 145.0000],
    ['Coburg', 'VIC 3058', -37.7440, 144.9660], ['Preston', 'VIC 3072', -37.7430, 145.0050],
    ['Melbourne', 'VIC 3000 · CBD', -37.8136, 144.9631], ['Docklands', 'VIC 3008', -37.8170, 144.9460],
    ['Richmond', 'VIC 3121', -37.8180, 145.0010], ['South Yarra', 'VIC 3141', -37.8380, 144.9920],
    ['St Kilda', 'VIC 3182', -37.8676, 144.9809], ['Hawthorn', 'VIC 3122', -37.8220, 145.0350],
    ['Footscray', 'VIC 3011', -37.8000, 144.9000], ['Box Hill', 'VIC 3128', -37.8189, 145.1218],
    ['Glen Waverley', 'VIC 3150', -37.8780, 145.1650], ['Geelong', 'VIC 3220', -38.1499, 144.3617],
  ].map(([name, sub, lat, lng]) => ({ name, sub, lat, lng }));

  const CINEMAS = [
    { name: 'Cinema Nova',             chain: 'Cinema Nova',    suburb: 'Carlton',     lat: -37.7983, lng: 144.9671, url: 'https://www.cinemanova.com.au',    formats: ['Std'] },
    { name: 'Hoyts Melbourne Central', chain: 'Hoyts',          suburb: 'CBD',         lat: -37.8102, lng: 144.9628, url: 'https://www.hoyts.com.au',         formats: ['Std', 'Std', 'LUX'] },
    { name: 'Village Crown',           chain: 'Village',        suburb: 'Southbank',   lat: -37.8237, lng: 144.9580, url: 'https://villagecinemas.com.au',    formats: ['Std', 'Gold Class', 'Vmax'] },
    { name: 'IMAX Melbourne',          chain: 'IMAX Melbourne', suburb: 'Carlton',     lat: -37.8033, lng: 144.9717, url: 'https://imaxmelbourne.com.au',     formats: ['IMAX'] },
    { name: 'Palace Westgarth',        chain: 'Palace',         suburb: 'Northcote',   lat: -37.7786, lng: 144.9989, url: 'https://www.palacecinemas.com.au', formats: ['Std'] },
    { name: 'Palace Como',             chain: 'Palace',         suburb: 'South Yarra', lat: -37.8391, lng: 144.9937, url: 'https://www.palacecinemas.com.au', formats: ['Std'] },
    { name: 'Lido Cinemas',            chain: 'Lido',           suburb: 'Hawthorn',    lat: -37.8217, lng: 145.0315, url: 'https://www.lidocinemas.com.au',   formats: ['Std'] },
    { name: 'Hoyts Highpoint',         chain: 'Hoyts',          suburb: 'Maribyrnong', lat: -37.7738, lng: 144.8880, url: 'https://www.hoyts.com.au',         formats: ['Std', 'Std', 'LUX'] },
    { name: 'Hoyts Chadstone',         chain: 'Hoyts',          suburb: 'Chadstone',   lat: -37.8862, lng: 145.0830, url: 'https://www.hoyts.com.au',         formats: ['Std', 'Std', 'LUX'] },
    { name: 'Village Southland',       chain: 'Village',        suburb: 'Cheltenham',  lat: -37.9580, lng: 145.0490, url: 'https://villagecinemas.com.au',    formats: ['Std', 'Std', 'Gold Class'] },
  ];

  // Posters are placeholder gradients until TMDb is wired in.
  const MOVIES = [
    { title: 'Alien: Romulus',       genre: 'Sci-fi horror', runtime: 119, poster: 'linear-gradient(160deg,#2C5A3F,#0E2316)' },
    { title: 'Inside Out 2',         genre: 'Animation',     runtime: 100, poster: 'linear-gradient(160deg,#5BA3E0,#1A4F86)' },
    { title: 'Deadpool & Wolverine', genre: 'Action comedy', runtime: 128, poster: 'linear-gradient(160deg,#D2453A,#5C1010)' },
    { title: 'Longlegs',             genre: 'Thriller',      runtime: 101, poster: 'linear-gradient(160deg,#4A4A78,#18182E)' },
    { title: 'The Substance',        genre: 'Body horror',   runtime: 140, poster: 'linear-gradient(160deg,#E0739A,#6A2040)' },
    { title: 'Dune: Part Two',       genre: 'Sci-fi epic',   runtime: 166, poster: 'linear-gradient(160deg,#D9A045,#6A4410)' },
    { title: 'The Wild Robot',       genre: 'Animation',     runtime: 102, poster: 'linear-gradient(160deg,#4DB38A,#155040)' },
    { title: 'Wicked',               genre: 'Musical',       runtime: 160, poster: 'linear-gradient(160deg,#8D5BD6,#2E1250)' },
    { title: 'Civil War',            genre: 'Action drama',  runtime: 109, poster: 'linear-gradient(160deg,#7A8A4A,#263010)' },
  ];

  /* ══ Seeded session generator ═══════════════════════════════
     Deterministic per (date, cinema) so the list is stable between renders. */
  function rng(seed) {
    return () => {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  const today0 = (() => { const d = now(); d.setHours(0, 0, 0, 0); return d; })();

  const DAYS = Array.from({ length: 7 }, (_, i) => {
    const d = new Date(today0); d.setDate(d.getDate() + i);
    const wd = d.toLocaleDateString('en-AU', { weekday: 'short' });
    return {
      idx: i, date: d,
      name: i === 0 ? 'Today' : i === 1 ? 'Tomorrow' : wd,
      short: i === 0 ? 'Today' : wd,
      num: d.getDate(),
    };
  });

  const SESSIONS = [];
  DAYS.forEach(day => {
    const seed = day.date.getFullYear() * 400 + day.date.getMonth() * 32 + day.date.getDate();
    CINEMAS.forEach((cinema, ci) => {
      const r = rng(seed * 97 + ci);
      const picks = [...MOVIES].sort(() => r() - 0.5).slice(0, 3);
      picks.forEach(movie => {
        const starts = [600 + 5 * Math.floor(r() * 78), 1020 + 5 * Math.floor(r() * 48)];
        if (r() < 0.45) starts.push(1260 + 5 * Math.floor(r() * 20));
        starts.forEach(startMin => SESSIONS.push({
          day, cinema, movie, startMin,
          format: cinema.formats[Math.floor(r() * cinema.formats.length)],
          start: new Date(day.date.getTime() + startMin * 60000),
        }));
      });
    });
  });

  /* ══ Geo + reachability (PRD §5.4) ═══════════════════════════ */
  function haversineKm(a, b) {
    const R = 6371, rad = x => x * Math.PI / 180;
    const dLat = rad(b.lat - a.lat), dLng = rad(b.lng - a.lng);
    const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLng / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(h));
  }
  // Stand-in for Geoapify routing: road ≈ 1.3× straight line, slower in the inner city, +4 min to park.
  const driveMinutes = km => Math.round(km * 1.3 / (km < 5 ? 22 : 34) * 60) + 4;

  function evaluate(s, origin, t) {
    const km = haversineKm(origin, s.cinema);
    const travel = driveMinutes(km);
    const slack = (s.start - t) / 60000 - travel;   // minutes to spare if you left right now
    const status = slack < -BUFFER_MIN ? 'missed' : slack < 0 ? 'trailers' : slack < TIGHT_MIN ? 'tight' : 'easy';
    return { ...s, km, travel, slack, status, leaveBy: new Date(s.start - travel * 60000) };
  }

  /* ══ Formatting ══════════════════════════════════════════════ */
  const NB = ' ';   // keep "14 min", "1h 42m" from breaking across lines
  const clock = d => d.toLocaleTimeString('en-AU', { hour: 'numeric', minute: '2-digit', hour12: true }).replace(/\s?([ap])\.?m\.?/i, `${NB}$1m`);
  const dur = m => m < 60 ? `${m}${NB}min` : `${Math.floor(m / 60)}h${m % 60 ? NB + (m % 60) + 'm' : ''}`;
  const runtime = m => `${Math.floor(m / 60)}h${NB}${String(m % 60).padStart(2, '0')}m`;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const periodOf = min => PERIODS.find(p => min >= p.from && min < p.to);
  const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;

  function cue(e) {
    if (e.status === 'trailers') return { cls: 'trailers', text: 'Leave now', note: 'You’ll arrive during the trailers' };
    if (e.status === 'tight')    return { cls: 'tight', text: e.slack < 1 ? 'Leave now' : `Leave in ${Math.floor(e.slack)}${NB}min` };
    if (e.day.idx === 0 && e.slack < 90) return { cls: '', text: `Leave in ${dur(Math.floor(e.slack))}` };
    return { cls: '', text: `Leave by ${clock(e.leaveBy)}` };
  }

  /* ══ State ═══════════════════════════════════════════════════
     mode 'now'     → today, starting within NOW_WINDOW, reachable from right now
     mode 'planned' → chosen days × chosen periods */
  const state = (() => {
    const t = now(), min = t.getHours() * 60 + t.getMinutes();
    const late = min >= 22 * 60 + 30;   // nothing left today — start on tomorrow evening
    return {
      origin: SUBURBS[0],
      mode: late ? 'planned' : 'now',
      days: new Set([late ? 1 : 0]),
      periods: new Set(['evening']),
      km: 30,
      expanded: new Set(),
    };
  })();

  function compute() {
    const t = now();
    const pool = state.mode === 'now'
      ? SESSIONS.filter(s => s.day.idx === 0 && s.start - t > -BUFFER_MIN * 60000 && s.start - t <= NOW_WINDOW * 60000)
      : SESSIONS.filter(s => state.days.has(s.day.idx) && state.periods.has(periodOf(s.startMin).id));
    const live = pool
      .map(s => evaluate(s, state.origin, t))
      .filter(e => e.km <= state.km && e.status !== 'missed')
      .sort((a, b) => a.start - b.start);

    const byFilm = new Map();
    live.forEach(e => {
      if (!byFilm.has(e.movie.title)) byFilm.set(e.movie.title, { movie: e.movie, sessions: [] });
      byFilm.get(e.movie.title).sessions.push(e);
    });
    // Films ordered by their soonest catchable session.
    return { films: [...byFilm.values()], sessionCount: live.length };
  }

  /* ══ Labels ══════════════════════════════════════════════════ */
  function daysText() {
    const ds = [...state.days].sort((a, b) => a - b).map(i => DAYS[i]);
    if (ds.length === 1) return ds[0].name;
    if (ds.length <= 3) return ds.map(d => d.short).join(', ');
    return `${ds.length} days`;
  }
  function periodsText(withRange) {
    const ps = PERIODS.filter(p => state.periods.has(p.id));
    if (ps.length === 4) return 'any time';
    return ps.map(p => p.name.toLowerCase() + (withRange && ps.length === 1 ? ` (${p.range})` : '')).join(' + ');
  }
  const whenText = withRange => state.mode === 'now' ? 'Leaving now' : `${daysText()}, ${periodsText(withRange)}`;
  const outOfRange = () => haversineKm(state.origin, CBD) > COVERAGE_KM;

  /* ══ Render ══════════════════════════════════════════════════ */
  const $ = id => document.getElementById(id);
  const SHOW_N = 3;
  const extIcon = '<svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true" style="display:inline;vertical-align:-1px;margin-left:4px;opacity:.6"><path d="M6 3h7v7M13 3 4 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function sessionHTML(e, multiDay) {
    const c = cue(e);
    return `<a class="s-row" href="${e.cinema.url}" target="_blank" rel="noopener"
               aria-label="${clock(e.start)}${multiDay ? ' ' + e.day.name : ''} at ${esc(e.cinema.name)}, ${dur(e.travel)} drive. ${c.text}${c.note ? ', ' + c.note.toLowerCase() : ''}. Opens ${esc(e.cinema.chain)} to book.">
      <span class="s-time tnum">${multiDay ? `<span class="d">${e.day.short} ${e.day.num}</span>` : ''}${clock(e.start)}</span>
      <span class="s-where"><span class="name">${esc(e.cinema.name)}</span>${e.format !== 'Std' ? `<span class="fmt">${esc(e.format)}</span>` : ''}${extIcon}
        <span class="trip tnum">${dur(e.travel)} drive · ${e.km.toFixed(1)}${NB}km</span></span>
      <span class="s-cue ${c.cls}">${c.text}</span>${c.note ? `<span class="s-note">${c.note}</span>` : ''}
    </a>`;
  }

  function filmHTML(f, multiDay) {
    const open = state.expanded.has(f.movie.title);
    const shown = open ? f.sessions : f.sessions.slice(0, SHOW_N);
    const hidden = f.sessions.length - SHOW_N;
    return `<article class="film">
      <div class="poster" style="background:${f.movie.poster}" aria-hidden="true"></div>
      <div class="film-head">
        <h2 class="film-title">${esc(f.movie.title)}</h2>
        <p class="film-meta">${esc(f.movie.genre)} · ${runtime(f.movie.runtime)}</p>
      </div>
      <div class="film-list">
        <div class="sessions">${shown.map(e => sessionHTML(e, multiDay)).join('')}</div>
        ${hidden > 0 ? `<button class="more" type="button" data-film="${esc(f.movie.title)}" aria-expanded="${open}">
          ${open ? 'Show fewer' : `${plural(hidden, 'more session')}`}</button>` : ''}
      </div>
    </article>`;
  }

  function suggestions() {
    const out = [];
    const nextKm = RADII[RADII.indexOf(state.km) + 1];
    if (nextKm) out.push({ label: `Widen to ${nextKm} km`, run: () => { state.km = nextKm; } });
    if (state.mode === 'now') {
      out.push({ label: 'Try tomorrow evening', run: () => { state.mode = 'planned'; state.days = new Set([1]); state.periods = new Set(['evening']); } });
    } else {
      const last = Math.max(...PERIODS.filter(p => state.periods.has(p.id)).map(p => p.from));
      const nextP = PERIODS.find(p => p.from > last);
      if (nextP) out.push({ label: `Add ${nextP.name.toLowerCase()}`, run: () => state.periods.add(nextP.id) });
      if (!state.days.has(1)) out.push({ label: 'Add tomorrow', run: () => state.days.add(1) });
    }
    return out;
  }

  function render() {
    const { films, sessionCount } = compute();

    $('summary-text').innerHTML = `<strong>${esc(state.origin.name)}</strong> · ${whenText(false)} · ${state.km} km`;
    $('show-btn').textContent = films.length ? `Show ${plural(films.length, 'film')}` : 'Show results';
    $('surprise-btn').disabled = !films.length;
    $('surprise-btn').title = films.length ? 'Pick something for me' : 'Nothing to pick from with these filters';

    if (outOfRange()) {
      $('results-title').textContent = 'We only cover Melbourne for now';
      $('results-sub').textContent = `${state.origin.name} is outside our area. Try a Melbourne suburb.`;
      $('list').innerHTML = '';
      return;
    }

    const where = `from ${state.origin.name}, within ${state.km} km`;
    if (state.mode === 'now') {
      $('results-title').textContent = films.length ? `${plural(films.length, 'film')} you can still make` : 'Nothing you can make right now';
      $('results-sub').textContent = `Starting in the next 3 hours · ${where}`;
    } else {
      $('results-title').textContent = films.length ? `${plural(films.length, 'film')} you can make` : 'Nothing in this window';
      $('results-sub').textContent = `${whenText(true)} · ${where}`;
    }

    if (!films.length) {
      const sug = suggestions();
      $('list').innerHTML = `<div class="empty"><p>Try loosening one thing:</p>
        <div class="pills">${sug.map((s, i) => `<button class="pill" type="button" data-sug="${i}">${s.label}</button>`).join('')}</div></div>`;
      $('list').querySelectorAll('[data-sug]').forEach(b => b.onclick = () => { sug[+b.dataset.sug].run(); update(); });
      return;
    }

    const multiDay = state.mode === 'planned' && state.days.size > 1;
    $('list').innerHTML = `<div class="film-grid">${films.map(f => filmHTML(f, multiDay)).join('')}</div>`;
    $('list').querySelectorAll('[data-film]').forEach(b => b.onclick = () => {
      const k = b.dataset.film;
      state.expanded.has(k) ? state.expanded.delete(k) : state.expanded.add(k);
      render();
    });
  }

  /* ══ Controls ════════════════════════════════════════════════ */
  function renderControls() {
    $('time-pills').innerHTML =
      `<button class="pill" type="button" data-time="now" aria-pressed="${state.mode === 'now'}">Leave now</button>` +
      PERIODS.map(p => `<button class="pill" type="button" data-time="${p.id}" title="${p.range}"
        aria-pressed="${state.mode === 'planned' && state.periods.has(p.id)}">${p.name}</button>`).join('');

    $('day-pills').innerHTML = DAYS.map(d =>
      `<button class="pill" type="button" data-day="${d.idx}"
        aria-pressed="${state.mode === 'now' ? d.idx === 0 : state.days.has(d.idx)}">${d.name}${d.idx > 1 ? `<span class="sub">${d.num}</span>` : ''}</button>`).join('');
    $('days-btn-text').textContent = state.mode === 'now' ? 'Today' : daysText();

    $('radius').value = state.km;
    if (document.activeElement !== $('loc-input')) $('loc-input').value = state.origin.name;
  }
  function update() { renderControls(); render(); }

  // "Leave now" is its own mode; picking any period or day switches to planning.
  $('time-pills').onclick = e => {
    const b = e.target.closest('[data-time]'); if (!b) return;
    const id = b.dataset.time;
    if (id === 'now') { state.mode = 'now'; }
    else if (state.mode === 'now') { state.mode = 'planned'; state.days = new Set([0]); state.periods = new Set([id]); }
    else if (state.periods.has(id)) { if (state.periods.size > 1) state.periods.delete(id); }
    else state.periods.add(id);
    update();
  };
  $('day-pills').onclick = e => {
    const b = e.target.closest('[data-day]'); if (!b) return;
    const idx = +b.dataset.day;
    if (state.mode === 'now') {
      if (idx === 0) return;
      state.mode = 'planned'; state.days = new Set([idx]); state.periods = new Set(['evening']);
    } else if (state.days.has(idx)) { if (state.days.size > 1) state.days.delete(idx); }
    else state.days.add(idx);
    update();
  };
  $('radius').onchange = e => { state.km = +e.target.value; update(); };

  // Days popover (desktop)
  $('days-btn').onclick = () => {
    const open = !$('days-pop').classList.contains('open');
    $('days-pop').classList.toggle('open', open);
    $('days-btn').setAttribute('aria-expanded', open);
  };
  document.addEventListener('click', e => {
    if (!e.target.closest('#days-ctl')) { $('days-pop').classList.remove('open'); $('days-btn').setAttribute('aria-expanded', 'false'); }
  });

  // Mobile filter sheet
  function setFilters(open) {
    document.body.classList.toggle('filters-open', open);
    $('summary-bar').setAttribute('aria-expanded', open);
    document.body.style.overflow = open ? 'hidden' : '';
    if (!open) $('summary-bar').focus();
  }
  $('summary-bar').onclick = () => setFilters(true);
  $('panel-close').onclick = () => setFilters(false);
  $('show-btn').onclick = () => { setFilters(false); window.scrollTo(0, 0); };

  // Theme
  $('theme-btn').onclick = () => {
    const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem('pmm-theme', next); } catch (e) {}
  };

  /* ── Location combobox ── */
  const input = $('loc-input'), list = $('ac-list');
  let matches = [], active = -1;

  function openList(q) {
    q = q.trim().toLowerCase();
    matches = q ? SUBURBS.filter(s => s.name.toLowerCase().includes(q) || s.sub.includes(q)).slice(0, 6) : [];
    active = matches.length ? 0 : -1;
    list.innerHTML = matches.length
      ? matches.map((s, i) => `<div class="ac-item" role="option" id="ac-${i}" data-i="${i}" aria-selected="${i === active}">
          <span class="ac-name">${esc(s.name)}</span><span class="ac-sub">${esc(s.sub)}</span></div>`).join('')
      : (q ? `<div class="ac-empty">No Melbourne suburb matches “${esc(q)}”.</div>` : '');
    list.hidden = !q;
    input.setAttribute('aria-expanded', !list.hidden);
    input.setAttribute('aria-activedescendant', active >= 0 ? `ac-${active}` : '');
  }
  function closeList() { list.hidden = true; input.setAttribute('aria-expanded', 'false'); }
  function choose(s) {
    state.origin = s;
    $('loc-note').hidden = true;
    closeList(); input.blur(); update();
  }
  function moveActive(d) {
    if (!matches.length) return;
    active = (active + d + matches.length) % matches.length;
    list.querySelectorAll('.ac-item').forEach((el, i) => el.setAttribute('aria-selected', i === active));
    input.setAttribute('aria-activedescendant', `ac-${active}`);
  }

  input.addEventListener('input', () => openList(input.value));
  input.addEventListener('focus', () => input.select());
  input.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); moveActive(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); moveActive(-1); }
    else if (e.key === 'Enter' && active >= 0 && !list.hidden) { e.preventDefault(); choose(matches[active]); }
    else if (e.key === 'Escape') { closeList(); input.value = state.origin.name; }
  });
  // Leaving the field without choosing restores the current location rather than showing stale text.
  input.addEventListener('blur', () => setTimeout(() => { closeList(); input.value = state.origin.name; }, 150));
  list.addEventListener('mousedown', e => { const it = e.target.closest('[data-i]'); if (it) { e.preventDefault(); choose(matches[+it.dataset.i]); } });

  $('geo-btn').onclick = () => {
    const note = $('loc-note');
    note.hidden = false; note.textContent = 'Finding you…';
    if (!navigator.geolocation) { note.textContent = 'Your browser can’t share location. Type a suburb instead.'; return; }
    navigator.geolocation.getCurrentPosition(
      p => choose({ name: 'Your location', sub: '', lat: p.coords.latitude, lng: p.coords.longitude }),
      () => { note.textContent = 'Couldn’t get your location. Type a suburb instead.'; },
      { timeout: 8000 }
    );
  };

  /* ══ Surprise me ═════════════════════════════════════════════
     Picks a film, then its soonest catchable session. */
  let picks = [], pickIdx = 0;
  function showPick() {
    const f = picks[pickIdx % picks.length], e = f.sessions[0], c = cue(e);
    $('m-poster').style.background = f.movie.poster;
    $('m-eyebrow').textContent = state.mode === 'now' ? 'You could see' : `For ${e.day.name.toLowerCase() === 'today' ? 'today' : e.day.name}`;
    $('m-title').textContent = f.movie.title;
    $('m-meta').textContent = `${f.movie.genre} · ${runtime(f.movie.runtime)}${e.format !== 'Std' ? ' · ' + e.format : ''}`;
    $('m-where').textContent = `${e.cinema.name} · ${dur(e.travel)} drive`;
    $('m-clock').textContent = clock(e.start);
    $('m-cue').className = `s-cue ${c.cls}`;
    $('m-cue').style.marginTop = '0';
    $('m-cue').textContent = c.text;
    $('m-book').href = e.cinema.url;
    $('m-book').textContent = `Book on ${e.cinema.chain}`;
    $('m-another').hidden = picks.length < 2;
  }
  function openSurprise() {
    const { films } = compute();
    if (!films.length) return;
    picks = [...films].sort(() => Math.random() - 0.5);
    pickIdx = 0;
    showPick();
    $('overlay').hidden = false;
    $('m-book').focus();
  }
  function closeSurprise() { $('overlay').hidden = true; $('surprise-btn').focus(); }
  $('surprise-btn').onclick = openSurprise;
  $('m-another').onclick = () => { pickIdx++; showPick(); };
  $('m-close').onclick = closeSurprise;
  $('overlay').onclick = e => { if (e.target === $('overlay')) closeSurprise(); };
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (!$('overlay').hidden) closeSurprise();
    else if ($('days-pop').classList.contains('open')) { $('days-pop').classList.remove('open'); $('days-btn').focus(); }
    else if (document.body.classList.contains('filters-open') && document.activeElement !== input) setFilters(false);
  });

  /* ══ Boot — countdowns refresh every 30 s ════════════════════ */
  update();
  setInterval(render, 30000);
  </script>
</body>
</html>
